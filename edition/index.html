<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>unMute edition</title>
<meta name="description" content="An edition of unMute, Artium Academy's travelling stage.">
<meta name="theme-color" content="#1C1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../site.css">
<style>
  .ehero { position: relative; background: var(--ink); color: var(--paper-hi); padding: 0 0 clamp(56px, 8vw, 96px); overflow: hidden; }
  .ehero .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .38; filter: grayscale(1) contrast(1.1); }
  .ehero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(28,20,16,.3), var(--ink) 92%); }
  .ehero .inner { position: relative; z-index: 2; }
  .ehero .mosaic { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); opacity: .32; }
  @media (min-width: 900px) { .ehero .mosaic { grid-template-columns: repeat(6, 1fr); } }
  .ehero .mosaic img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.1); }
  .ehero .bignum { position: absolute; right: var(--gutter); bottom: -.12em; font-weight: 800; font-stretch: 125%; line-height: .8;
    font-size: clamp(220px, 42vw, 600px); color: transparent; -webkit-text-stroke: 1.5px rgba(251,250,248,.16); pointer-events: none; }
  .ehero .inner { display: grid; gap: 30px; align-items: end; padding-top: clamp(56px, 9vw, 120px); }
  @media (min-width: 900px) { .ehero .inner { grid-template-columns: 1fr auto; } }
  .eno { display: inline-block; margin-bottom: 16px; color: var(--yellow); }
  .ehero h1 { font-size: clamp(48px, 11vw, 150px); }
  .ehero .when { margin: 18px 0 0; font-size: clamp(18px, 2.2vw, 22px); font-weight: 600; }
  .ehero .note { margin: 10px 0 0; color: rgba(243,241,236,.75); max-width: 44ch; }
  .ehero .pc { width: min(78vw, 380px); transform: rotate(3deg); box-shadow: 0 24px 40px -18px rgba(0,0,0,.7); }
  .ehero .btn { margin-top: 26px; }
  section.s { padding: clamp(64px, 9vw, 110px) 0; }
  .s h2 { margin-bottom: clamp(26px, 4vw, 44px); }
  .s .head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 30px; margin-bottom: clamp(26px, 4vw, 44px); }
  .s .head h2 { margin: 0; } .s .head p { margin: 0; color: var(--soft); max-width: 38ch; }
  .vids { display: grid; gap: 14px; }
  @media (min-width: 760px) { .vids { grid-template-columns: 1fr 1fr; } }
  .empty { font-size: 20px; color: var(--soft); }
  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 2px solid var(--ink); padding-top: 22px; }
  .pager a { text-decoration: none; }
  .pager a small { display: block; color: var(--soft); font-weight: 600; }
  .pager a b { font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(18px, 2.4vw, 30px); line-height: 1.1; }
  .pager a:hover b { color: var(--pink); }
  .pager .next { text-align: right; grid-column: 2; }
  .cta { background: var(--pink); color: var(--paper-hi); padding: clamp(64px, 10vw, 120px) 0; }
  .cta h2 { font-size: clamp(34px, 6vw, 80px); max-width: 14ch; margin: 0; }
  .cta p { max-width: 38ch; margin: 22px 0 30px; font-size: clamp(18px, 2vw, 21px); }
</style>
</head>
<body data-root="../">
<div id="site-header"></div>
<div class="ehero" id="ehero-box"><div class="wrap inner" id="ehero"></div></div>
<main id="page"></main>
<div id="site-footer"></div>

<script src="../data.js"></script>
<script src="../site.js"></script>
<script>
(function () {
  var U = UM, D = U.D, esc = U.esc;
  U.mount('editions');
  var id = new URLSearchParams(location.search).get('e') || location.hash.slice(1);
  var e = U.ed(id), page = document.getElementById('page'), hero = document.getElementById('ehero');
  if (!e) {
    hero.innerHTML = '<div><h1 class="d" style="font-size:clamp(56px,10vw,120px)">Edition not found</h1><a class="btn light" href="../index.html#editions">All editions</a></div>';
    return;
  }
  var past = U.isPast(e), people = U.artistsOf(e.id);
  document.title = 'unMute ' + e.city + ', ' + U.dateMed(e);

  /* banner: group photo if we have one, else a mosaic of the lineup, else the edition number in big type */
  var box = document.getElementById('ehero-box');
  var withPh = people.filter(function (a) { return a.photos && a.photos.length; });
  var seenPh = {}; withPh = withPh.filter(function (a) { var k = a.photos[0]; if (seenPh[k]) return false; seenPh[k] = 1; return true; });
  if (e.group) box.insertAdjacentHTML('afterbegin', '<img class="bg" src="' + U.photo(e.group, 1800, 1000).src + '" alt="">');
  else if (withPh.length >= 3) box.insertAdjacentHTML('afterbegin', '<div class="mosaic" aria-hidden="true">' + withPh.slice(0, 6).map(function (a) { var p = U.photo(a.photos[0], 500, 700); return '<img src="' + p.src + '" style="object-position:' + p.pos + ' 30%" alt="">'; }).join('') + '</div>');
  else box.insertAdjacentHTML('afterbegin', '<div class="bignum" aria-hidden="true">' + (e.n < 10 ? '0' : '') + e.n + '</div>');
  hero.innerHTML = '<div><span class="eno label">Edition ' + e.n + (U.isLive(e) ? ', out now' : past ? '' : ', upcoming') + '</span><h1 class="d">' + esc(e.city) + '</h1>' +
    '<p class="when">' + U.dateLong(e) + (e.venue ? ', ' + esc(e.venue) : '') + '</p><p class="note">' + esc(e.note) + '</p>' +
    (!past && e.page ? '<a class="btn light" href="../' + e.page + '">Open the show page</a>' : '') + '</div>' +
    (e.postcard ? '<img class="pc" src="' + U.postcard(e, 760) + '" alt="unMute ' + esc(e.city) + ' postcard">' : '');

  var vids = people.filter(function (a) { return a.video; }).sort(function (x, y) { return (y.out ? Date.parse(y.out) : 0) - (x.out ? Date.parse(x.out) : 0); });

  /* everything the city has put out on Instagram and YouTube, newest first */
  var posts = U.feed(e.id);
  var postsHTML = posts.length ? '<section class="s" style="padding-top:0" id="posts"><div class="wrap"><div class="head"><h2 class="d">From unMute ' + esc(e.city) + '</h2><p>' +
    (U.isLive(e) ? 'New videos from the ' + esc(e.city) + ' lineup are going out now.' : 'Everything from unMute ' + esc(e.city) + '.') + '</p></div>' +
    '<div class="posts">' + posts.slice(0, 12).map(function (x) { return U.postCard(x, true); }).join('') + '</div></div></section>' : '';
  var all = D.editions.slice().sort(function (a, b) { return a.n - b.n; }), i = all.indexOf(e);
  var prev = all[i - 1], next = all[i + 1];

  page.innerHTML =
    '<section class="s"><div class="wrap"><h2 class="d">' + 'Lineup' + '</h2>' +
    (people.length ? '<div class="agrid">' + people.map(function (a) { return U.card(a); }).join('') + '</div>'
                   : '<p class="empty">' + (e.count ? e.count + ' performers, names coming soon.' : 'Lineup coming soon.') + '</p>') +
    '</div></section>' + postsHTML +
    (vids.length ? '<section class="s" style="padding-top:0"><div class="wrap"><h2 class="d">Watch</h2><div class="vids">' + vids.map(function (a) {
      return '<a class="ytlink" href="https://www.youtube.com/watch?v=' + a.video + '" target="_blank" rel="noopener"><span class="th"><img src="https://i.ytimg.com/vi/' + a.video + '/mqdefault.jpg" alt=""></span><span><b>' + esc(a.songs[0]) + '</b><span>' + esc(a.name) + '. Opens YouTube.</span></span></a>';
    }).join('') + '</div></div></section>' : '') +
    '<section class="s" style="padding-top:0"><div class="wrap"><nav class="pager" aria-label="Other editions">' +
    (prev ? '<a href="' + U.editionURL(prev) + '"><small>Edition ' + prev.n + '</small><b>' + esc(prev.city) + ' ' + U.year(prev) + '</b></a>' : '') +
    (next ? '<a class="next" href="' + U.editionURL(next) + '"><small>Edition ' + next.n + '</small><b>' + esc(next.city) + ' ' + U.year(next) + '</b></a>' : '') +
    '</nav></div></section>' +
    '<section class="cta"><div class="wrap"><h2 class="d">Start with a free class</h2><p>Book a trial class with an Artium teacher. If you enrol afterwards, your first course is 15% off.</p><a class="btn light" href="' + U.trial('EDITION', e.id) + '">Book a free class</a></div></section>';

  U.wire(page);
  U.nextbar(500);
  U.announce();
})();
</script>
</body>
</html>
