<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>unMute performer form</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F0EB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  body { background: var(--paper); }
  .fbar { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); }
  .fbar .in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); }
  .fbar .unmute-logo { height: 26px; width: auto; display: block; color: var(--ink); }
  .fbar .count { font-size: 14px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .prog { height: 3px; background: var(--line); }
  .prog i { display: block; height: 100%; width: 0; background: var(--pink); transition: width .35s ease; }

  .fwrap { max-width: 680px; margin: 0 auto; padding: clamp(32px, 6vw, 64px) max(16px, env(safe-area-inset-right)) 140px max(16px, env(safe-area-inset-left)); }
  .fwrap h1 { font-size: clamp(38px, 8vw, 64px); line-height: .95; margin: 0 0 24px; }
  .fwrap h2.d { font-size: clamp(28px, 6vw, 44px); line-height: 1; margin: 0 0 10px; }
  .sechelp { color: var(--soft); margin: 0 0 8px; max-width: 56ch; }
  .intro p { font-size: 18px; max-width: 56ch; margin: 0 0 1em; }
  .intro .btn { margin-top: 14px; }
  .intro .alt { display: block; margin-top: 18px; font-size: 15px; }

  .fq { padding: 26px 0 4px; border-top: 1px solid var(--line); margin-top: 22px; }
  .fq:first-of-type { border-top: 0; margin-top: 10px; }
  .fq label.ql, .fq legend { display: block; font-weight: 600; font-size: 19px; line-height: 1.3; padding: 0; margin: 0 0 4px; }
  .fq legend { float: left; width: 100%; }
  .fq legend + * { clear: both; }
  .fq .req { color: var(--pink); margin-left: 3px; }
  .fq .qh { color: var(--soft); font-size: 15px; margin: 0 0 12px; white-space: pre-line; }
  .fq fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .fq input[type=text], .fq input[type=email], .fq textarea, .fq select {
    width: 100%; font: inherit; font-size: 18px; color: var(--ink); background: var(--white); border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 14px; }
  .fq textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
  .fq input:focus, .fq textarea:focus, .fq select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(235,226,63,.6); }
  .opts { display: grid; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; background: var(--white); border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 14px; cursor: pointer; font-size: 17px; line-height: 1.35; }
  .opt input { width: 20px; height: 20px; flex: none; accent-color: var(--ink); margin: 0; }
  .opt:has(input:checked) { border-color: var(--ink); background: var(--yellow); }
  .opt:has(input:focus-visible) { box-shadow: 0 0 0 3px rgba(224,0,115,.35); }
  .fq.bad input, .fq.bad textarea, .fq.bad select, .fq.bad .opt { border-color: var(--pink); }
  .err { color: var(--pink); font-size: 15px; font-weight: 600; margin: 8px 0 0; }

  .drop { display: grid; place-items: center; text-align: center; gap: 4px; border: 1.5px dashed var(--soft); border-radius: 12px; padding: 26px 16px; background: var(--white); cursor: pointer; }
  .drop b { font-size: 17px; } .drop span { color: var(--soft); font-size: 14px; }
  .drop.over { border-color: var(--ink); background: var(--yellow); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-top: 12px; }
  .thumbs figure { position: relative; margin: 0; aspect-ratio: 4/5; border-radius: 8px; overflow: hidden; background: var(--paper-2); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .thumbs button { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--ink); color: var(--white); font-size: 16px; line-height: 1; cursor: pointer; }

  .fnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--paper); border-top: 1px solid var(--line); }
  .fnav .in { max-width: 680px; margin: 0 auto; display: flex; justify-content: space-between; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .fnav .back { all: unset; cursor: pointer; font-weight: 600; padding: 12px 4px; text-decoration: underline; text-underline-offset: 5px; }
  .fnav .back:focus-visible { outline: 2px solid var(--pink); }
  .fnav .btn { margin-left: auto; }

  .rv { border-top: 2px solid var(--ink); padding-top: 14px; margin-top: 30px; }
  .rv-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .rv-h h3 { margin: 0; font-size: 20px; }
  .rv-h button { all: unset; cursor: pointer; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; }
  .rv dl { margin: 10px 0 0; }
  .rv dt { color: var(--soft); font-size: 14px; margin-top: 12px; }
  .rv dd { margin: 2px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
  .rv dd.none { color: var(--soft); font-style: italic; }
  .note { background: var(--white); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 24px; }
  .done h1 { color: var(--ink); }
</style>
</head>
<body data-root="/">
<div class="fbar"><div class="in"><span id="logo"></span><span class="count" id="count"></span></div><div class="prog"><i id="prog"></i></div></div>
<main class="fwrap" id="app" aria-live="polite"></main>
<nav class="fnav" id="nav" hidden><div class="in"><button type="button" class="back" id="back">Back</button><button type="button" class="btn" id="next">Next</button></div></nav>

<script src="/data.js"></script>
<script src="/site.js"></script>
<script src="/form/spec.js"></script>
<script>
/* Where answers are sent: the web app URL from tools/form-backend.gs (Deploy > New deployment > Web app). */
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxuoOuCJkiU6EgbmIwfTIs5eWXAPTZrx0aD_bJ2J8vI59YtjWuv_JwZ39s1NtVFpexVIw/exec';

(function () {
  var F = window.UNMUTE_FORM, U = window.UM, esc = U.esc;
  var params = new URLSearchParams(location.search);
  // short links: /form/kolkata-2027 and /form/kolkata-2027/after (a show's id from data.js)
  var path = location.pathname.match(/\/form\/([a-z0-9-]+?)(?:\/(after))?\/?$/i);
  var PART = params.get('part') === 'after' || (path && path[2]) ? 'after' : 'before';
  var PAGES = F[PART], KEY = 'um-form-' + PART;
  var app = document.getElementById('app'), nav = document.getElementById('nav');
  var A = {}, photos = [], step = -1;   // step -1 = intro, PAGES.length = review

  document.getElementById('logo').innerHTML = U.logo('', 'artium unMute');

  try { A = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { A = {}; }
  // ?e=kolkata-2027 fills in the edition
  var eParam = params.get('e'), ed = eParam && U.ed(eParam);
  if (!ed && path) ed = U.ed(path[1].toLowerCase());
  if (!ed && path && path[1] !== 'index') {   // a city name: its next show, or its latest one if none is coming
    var c = path[1].toLowerCase(), mine = U.D.editions.filter(function (x) { return x.city.toLowerCase() === c && !x.tba; });
    ed = mine.filter(function (x) { return !U.isPast(x); }).sort(function (x, y) { return Date.parse(x.date) - Date.parse(y.date); })[0] ||
         mine.sort(function (x, y) { return Date.parse(y.date) - Date.parse(x.date); })[0];
  }
  if (ed && !A.edition) A.edition = ed.city + ', ' + U.MONTHS[U.parts(ed).m - 1] + ' ' + U.year(ed);
  function save() { try { localStorage.setItem(KEY, JSON.stringify(A)); } catch (e) {} }

  /* ---- who sees what ---- */
  function roleCode() { var r = A.role || ''; return /teacher/i.test(r) ? 'T' : /team/i.test(r) ? 'M' : /learner/i.test(r) ? 'L' : ''; }
  function visible(q) {
    var rc = roleCode();
    if (q.who !== 'LTM' && (!rc || q.who.indexOf(rc) < 0)) return false;
    if (q.show) {
      var v = q.show[0] === 'photos' ? (photos.length ? ['x'] : []) : [].concat(A[q.show[0]] || []);
      if (q.show[1][0] === '*') return v.length > 0;
      if (!v.some(function (x) { return q.show[1].indexOf(x) > -1; })) return false;
    }
    return true;
  }
  function pageItems(i) { return PAGES[i].items.filter(visible); }
  function steps() { var s = []; PAGES.forEach(function (p, i) { if (i === 0 || pageItems(i).length) s.push(i); }); return s; }
  function empty(q) { var v = q.t === 'photos' ? photos : A[q.id]; return v == null || (Array.isArray(v) ? !v.length : !String(v).trim()); }

  /* ---- one question ---- */
  function field(q) {
    var id = 'q-' + q.id, v = A[q.id], star = q.req ? '<span class="req" aria-hidden="true">*</span>' : '';
    var help = q.help ? '<p class="qh" id="' + id + '-h">' + esc(q.help) + '</p>' : '';
    var desc = q.help ? ' aria-describedby="' + id + '-h"' : '';
    if (q.t === 'choice' || q.t === 'check') {
      var type = q.t === 'choice' ? 'radio' : 'checkbox', vals = [].concat(v || []);
      return '<div class="fq" data-q="' + q.id + '"><fieldset' + desc + '><legend>' + esc(q.q) + star + '</legend>' + help + '<div class="opts">' +
        q.opts.map(function (o, i) { return '<label class="opt"><input type="' + type + '" name="' + id + '" id="' + id + '-' + i + '" value="' + esc(o) + '"' + (vals.indexOf(o) > -1 ? ' checked' : '') + (q.req && type === 'radio' ? ' required' : '') + '>' + esc(o) + '</label>'; }).join('') +
        '</div></fieldset></div>';
    }
    var lab = '<label class="ql" for="' + id + '">' + esc(q.q) + star + '</label>' + help, ctl;
    if (q.t === 'para') ctl = '<textarea id="' + id + '"' + desc + '>' + esc(v || '') + '</textarea>';
    else if (q.t === 'list') ctl = '<select id="' + id + '"' + desc + '><option value="">Choose one</option>' + q.opts.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    else if (q.t === 'photos') ctl = '<label class="drop" id="drop" for="' + id + '"><b>Add photos</b><span>JPG or PNG, up to 5. Tap to choose or drop them here.</span></label><input type="file" id="' + id + '" accept="image/*" multiple hidden' + desc + '><div class="thumbs" id="thumbs"></div>';
    else ctl = '<input type="' + (q.t === 'email' ? 'email' : 'text') + '" id="' + id + '" value="' + esc(v || '') + '"' + desc + (q.t === 'email' ? ' autocomplete="email"' : q.id === 'name' ? ' autocomplete="name"' : q.id === 'phone' ? ' autocomplete="tel" inputmode="tel"' : '') + '>';
    return '<div class="fq" data-q="' + q.id + '">' + lab + ctl + '</div>';
  }

  /* ---- screens ---- */
  function chrome() {
    var s = steps(), pos = s.indexOf(step);
    document.getElementById('count').textContent = step < 0 ? '' : step >= PAGES.length ? 'Review' : (pos + 1) + ' of ' + s.length;
    document.getElementById('prog').style.width = step < 0 ? '0' : step >= PAGES.length ? '100%' : Math.round(pos / s.length * 100) + '%';
    nav.hidden = step < 0 || step === 'done';
    document.getElementById('back').hidden = step < 0;
    document.getElementById('next').textContent = step >= PAGES.length ? 'Send my answers' : pos === s.length - 1 ? 'Review' : 'Next';
  }

  function intro() {
    step = -1;
    var started = Object.keys(A).some(function (k) { return k !== 'edition'; });
    var paras = PART === 'after' ? F.after_intro : F.intro;
    app.innerHTML = '<div class="intro"><h1 class="d">' + (PART === 'after' ? 'After the show' : 'Your unMute') + '</h1>' +
      paras.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
      '<button type="button" class="btn" id="start">' + (started ? 'Continue where you left off' : 'Start') + '</button>' +
      (started ? '<a href="#" class="alt ulink" id="fresh">Start again with a blank form</a>' : '') + '</div>';
    document.getElementById('start').onclick = function () { show(steps()[0]); };
    var fr = document.getElementById('fresh');
    if (fr) fr.onclick = function (e) { e.preventDefault(); A = {}; photos = []; save(); intro(); };
    chrome();
  }

  function show(i) {
    step = i;
    var p = PAGES[i];
    app.innerHTML = '<h2 class="d">' + esc(p.title) + '</h2>' + (p.help ? '<p class="sechelp">' + esc(p.help) + '</p>' : '') +
      '<div id="qs">' + pageItems(i).map(field).join('') + '</div>';
    wire();
    chrome();
    window.scrollTo(0, 0);
  }

  // re-render the questions on this page when an answer changes who sees what
  function refresh() {
    var keep = document.activeElement && document.activeElement.id;
    document.getElementById('qs').innerHTML = pageItems(step).map(field).join('');
    wire(); chrome();
    if (keep && document.getElementById(keep)) document.getElementById(keep).focus();
  }

  function wire() {
    app.querySelectorAll('.fq').forEach(function (box) {
      var qid = box.getAttribute('data-q'), q = find(qid);
      box.addEventListener('input', function () { read(q, box); box.classList.remove('bad'); var er = box.querySelector('.err'); if (er) er.remove(); });
      box.addEventListener('change', function () { read(q, box); if (q.t === 'choice' || q.t === 'check' || q.t === 'list') refresh(); });
    });
    var fi = document.getElementById('q-photos');
    if (fi) {
      drawThumbs();
      fi.addEventListener('change', function () { addPhotos(fi.files); fi.value = ''; });
      var dz = document.getElementById('drop');
      ['dragenter', 'dragover'].forEach(function (t) { dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (t) { dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.remove('over'); }); });
      dz.addEventListener('drop', function (e) { addPhotos(e.dataTransfer.files); });
    }
  }
  function find(id) { for (var i = 0; i < PAGES.length; i++) for (var j = 0; j < PAGES[i].items.length; j++) if (PAGES[i].items[j].id === id) return PAGES[i].items[j]; }
  function read(q, box) {
    if (q.t === 'photos') return;
    if (q.t === 'check') A[q.id] = [].map.call(box.querySelectorAll('input:checked'), function (x) { return x.value; });
    else if (q.t === 'choice') { var c = box.querySelector('input:checked'); A[q.id] = c ? c.value : ''; }
    else A[q.id] = box.querySelector('input,textarea,select').value;
    save();
  }

  /* ---- photos: shrunk on the device so uploads are quick ---- */
  function addPhotos(files) {
    [].slice.call(files).filter(function (f) { return /^image\//.test(f.type); }).slice(0, 5 - photos.length).forEach(function (f) {
      var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function () {
        var s = Math.min(1, 2800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        photos.push({ name: f.name.replace(/\.[^.]+$/, '') + '.jpg', data: c.toDataURL('image/jpeg', 0.9) });
        URL.revokeObjectURL(url); drawThumbs(); refresh();
      };
      img.src = url;
    });
  }
  function drawThumbs() {
    var t = document.getElementById('thumbs'); if (!t) return;
    t.innerHTML = photos.map(function (p, i) { return '<figure><img src="' + p.data + '" alt="Photo ' + (i + 1) + '"><button type="button" data-i="' + i + '" aria-label="Remove photo ' + (i + 1) + '">×</button></figure>'; }).join('');
    t.querySelectorAll('button').forEach(function (b) { b.onclick = function () { photos.splice(+b.getAttribute('data-i'), 1); drawThumbs(); refresh(); }; });
  }

  /* ---- moving between pages ---- */
  function check() {
    var bad = null;
    pageItems(step).forEach(function (q) {
      if (q.req && empty(q)) {
        var box = app.querySelector('[data-q="' + q.id + '"]');
        if (box && !box.querySelector('.err')) { box.classList.add('bad'); box.insertAdjacentHTML('beforeend', '<p class="err">Please answer this.</p>'); }
        bad = bad || box;
      }
      if (q.t === 'email' && A[q.id] && !/^\S+@\S+\.\S+$/.test(A[q.id])) {
        var b2 = app.querySelector('[data-q="' + q.id + '"]');
        if (!b2.querySelector('.err')) { b2.classList.add('bad'); b2.insertAdjacentHTML('beforeend', '<p class="err">Check the email address.</p>'); }
        bad = bad || b2;
      }
    });
    if (bad) { bad.scrollIntoView({ block: 'center' }); var f = bad.querySelector('input,textarea,select'); if (f) f.focus({ preventScroll: true }); }
    return !bad;
  }
  document.getElementById('next').onclick = function () {
    if (step >= PAGES.length) return send();
    if (!check()) return;
    var s = steps(), pos = s.indexOf(step);
    pos < s.length - 1 ? show(s[pos + 1]) : review();
  };
  document.getElementById('back').onclick = function () {
    var s = steps();
    if (step >= PAGES.length) return show(s[s.length - 1]);
    var pos = s.indexOf(step);
    pos > 0 ? show(s[pos - 1]) : intro();
  };

  /* ---- review and send ---- */
  function answerText(q) {
    if (q.t === 'photos') return photos.length ? photos.length + ' photo' + (photos.length > 1 ? 's' : '') : '';
    var v = A[q.id]; return Array.isArray(v) ? v.join('\n') : (v || '');
  }
  function readable() {
    return steps().map(function (i) { return { section: PAGES[i].title, items: pageItems(i).map(function (q) { return { id: q.id, q: q.q, a: answerText(q) }; }) }; });
  }
  function review() {
    step = PAGES.length;
    app.innerHTML = '<h2 class="d">Check your answers</h2><p class="sechelp">Make any changes, then send.</p>' +
      readable().map(function (s) {
        var idx = PAGES.map(function (p) { return p.title; }).indexOf(s.section);
        return '<section class="rv"><div class="rv-h"><h3>' + esc(s.section) + '</h3><button type="button" data-p="' + idx + '">Edit</button></div><dl>' +
          s.items.map(function (x) { return '<dt>' + esc(x.q) + '</dt><dd' + (x.a ? '' : ' class="none"') + '>' + (x.a ? esc(x.a) : 'Not answered') + '</dd>'; }).join('') + '</dl></section>';
      }).join('');
    app.querySelectorAll('.rv-h button').forEach(function (b) { b.onclick = function () { show(+b.getAttribute('data-p')); }; });
    chrome(); window.scrollTo(0, 0);
  }

  function payload() {
    var answers = {};
    steps().forEach(function (i) { pageItems(i).forEach(function (q) { if (q.t !== 'photos') answers[q.id] = A[q.id] == null ? '' : A[q.id]; }); });
    return { part: PART, sentAt: new Date().toISOString(), answers: answers, readable: readable(), photos: photos };
  }
  function send() {
    var btn = document.getElementById('next');
    var data = payload();
    if (!ENDPOINT) { failed(data, 'This form is not connected to its storage yet.'); return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(data) })   // sent as plain text so the browser makes a simple request
      .then(function (r) { return r.json(); })
      .then(function (r) { if (!r.ok) throw new Error(r.error || 'not saved'); done(); })
      .catch(function () { btn.disabled = false; btn.textContent = 'Try again'; failed(data, 'Your answers did not reach us. Check your connection and try again.'); });
  }
  function failed(data, msg) {
    var old = document.getElementById('sendnote'); if (old) old.remove();
    var blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    app.insertAdjacentHTML('beforeend', '<div class="note" id="sendnote"><p class="err" style="margin-top:0">' + esc(msg) + '</p>' +
      '<p style="margin:6px 0 0">Your answers are still saved on this device. If it keeps failing, <a class="ulink" download="unmute-' + esc((A.name || 'answers').replace(/\s+/g, '-').toLowerCase()) + '.json" href="' + URL.createObjectURL(blob) + '">download them</a> and send the file to the unMute team.</p></div>');
    document.getElementById('sendnote').scrollIntoView({ block: 'center' });
  }
  function done() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    step = 'done';
    app.innerHTML = '<div class="intro done"><h1 class="d">Thank you' + (A.caption_name || A.name ? ', ' + esc((A.caption_name || A.name).split(' ')[0]) : '') + '</h1><p>' + esc(F.thanks) + '</p>' +
      '<a class="btn" href="/">Go to the unMute site</a></div>';
    document.getElementById('prog').style.width = '100%'; document.getElementById('count').textContent = 'Sent';
    nav.hidden = true; window.scrollTo(0, 0);
  }

  intro();
})();
</script>
</body>
</html>
